<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louder: turn a local problem into a case your representative can act on</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F8;--ink:#0E1A3A;--panel:#fff;--blue:#1B3FD1;--yellow:#FFC71F;--line:#C9D0E4;--muted:#4A5678;--onyellow:#0E1A3A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1126;--ink:#EAF0FF;--panel:#141C3A;--blue:#8FA7FF;--line:#2A3560;--muted:#9AA8D6}}
:root[data-theme="dark"]{--bg:#0B1126;--ink:#EAF0FF;--panel:#141C3A;--blue:#8FA7FF;--line:#2A3560;--muted:#9AA8D6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Archivo,"Arial Narrow",Impact,sans-serif;font-stretch:80%;line-height:1.05;margin:0}
header{padding:28px 20px 8px;max-width:1120px;margin:0 auto}
h1{font-size:clamp(44px,9vw,84px);font-weight:900;letter-spacing:-.02em}
header p{max-width:56ch;color:var(--muted);font-size:18px;margin:10px 0 0}
main{max-width:1120px;margin:0 auto;padding:16px 20px 60px;display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:20px}
h2{font-size:26px;font-weight:800;margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:8px 0}
.checks input{margin-top:5px;accent-color:var(--blue)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
button{font:700 15px "Public Sans",sans-serif;border:2px solid var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--yellow);color:var(--onyellow)}
button.ghost{background:transparent;color:var(--ink)}
button:hover{filter:brightness(.95)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.scorebox{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sign{width:118px;height:118px;flex:none;margin:14px 16px 14px 14px;background:var(--yellow);border:5px solid #0E1A3A;border-radius:12px;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 0 3px var(--yellow)}
.sign span{transform:rotate(-45deg);font:900 46px Archivo,Impact,sans-serif;color:#0E1A3A}
.verdict h3{font-size:30px;font-weight:800}
.verdict p{margin:6px 0 0;color:var(--muted)}
.bar{margin:10px 0}.bar b{font-size:14px;display:flex;justify-content:space-between}
.track{height:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--blue);transition:width .35s}
.tips{margin:8px 0 0;padding-left:20px}.tips li{margin:6px 0}
.doc{white-space:pre-wrap;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:14px;font:400 15px/1.6 "Public Sans",sans-serif;margin:8px 0 0}
.tabs{display:flex;gap:8px;margin:22px 0 4px}
.tabs button{background:transparent;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--panel)}
.saved li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;list-style:none}
.saved ul{padding:0;margin:0}
.target{border-left:6px solid var(--yellow);background:var(--bg);padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Louder</h1>
  <p>Describe a problem in your community. Louder scores how strong your case is, tells you who can actually fix it, and writes your letter and call script.</p>
</header>
<main>
  <section class="panel" aria-labelledby="f">
    <h2 id="f">Your problem</h2>
    <label for="problem">What is wrong?</label>
    <input id="problem" type="text" placeholder="No crosswalk at the entrance of our school">
    <div class="row">
      <div><label for="cat">Type of problem</label><select id="cat"></select></div>
      <div><label for="place">Where?</label><input id="place" type="text" placeholder="Maple St &amp; 5th Ave, Boise"></div>
    </div>
    <div class="row">
      <div><label for="people">People affected</label><input id="people" type="number" min="1" value="200"></div>
      <div><label for="months">Months it has gone on</label><input id="months" type="number" min="0" value="6"></div>
    </div>
    <label for="risk">Safety risk: <output id="riskOut">3</output> of 5</label>
    <input id="risk" type="range" min="0" max="5" value="3">
    <p class="hint">0 means an annoyance. 5 means someone could be seriously hurt.</p>
    <label>Evidence you have</label>
    <div class="checks" id="evid"></div>
    <label for="ask">What should be done?</label>
    <textarea id="ask" placeholder="Fund and install a marked crosswalk with a flashing beacon"></textarea>
    <div class="row">
      <div><label for="name">Your name</label><input id="name" type="text" placeholder="Alex Rivera"></div>
      <div><label for="rep">Your representative’s last name</label><input id="rep" type="text" placeholder="Smith"></div>
    </div>
    <div class="actions">
      <button id="sample" class="ghost" type="button">Try an example</button>
      <button id="save" type="button">Save this case</button>
    </div>
    <div class="saved" id="savedBox" hidden><h3 style="font-size:20px;margin-top:22px">Saved cases</h3><ul id="savedList"></ul></div>
  </section>

  <section class="panel" aria-live="polite" aria-labelledby="r">
    <h2 id="r">Your case</h2>
    <div class="scorebox">
      <div class="sign" aria-hidden="true"><span id="score">0</span></div>
      <div class="verdict"><h3 id="verdict"></h3><p id="verdictSub"></p></div>
    </div>
    <div id="bars"></div>
    <div class="target" id="target"></div>
    <h3 style="font-size:20px">Make it stronger</h3>
    <ul class="tips" id="tips"></ul>
    <div class="tabs" role="tablist">
      <button role="tab" id="t1" aria-selected="true" type="button">Letter</button>
      <button role="tab" id="t2" aria-selected="false" type="button">60-second call</button>
    </div>
    <div class="doc" id="doc" tabindex="0"></div>
    <div class="actions"><button id="copy" type="button">Copy text</button></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- data ----------
var CATS = {
  roads:   {label:"Roads, sidewalks and crossings", fit:0.9, progs:["the Safe Streets and Roads for All grant program","federal-aid highway funding"]},
  safety:  {label:"Public safety", fit:0.6, progs:["Department of Justice community policing and violence-prevention grants"]},
  schools: {label:"Schools and education", fit:0.7, progs:["Department of Education funding streams such as Title I"]},
  env:     {label:"Environment and clean water", fit:0.85, progs:["EPA water and brownfield cleanup grants"]},
  housing: {label:"Housing", fit:0.75, progs:["HUD housing programs"]},
  health:  {label:"Health and mental health", fit:0.7, progs:["HHS community health and behavioral health funding"]},
  internet:{label:"Internet and technology access", fit:0.95, progs:["the BEAD broadband program","FCC connectivity programs"]},
  other:   {label:"Another local issue", fit:0.3, progs:[]}
};
var EVID = [
  ["photos","I have photos or video"],
  ["log","I have written down dates and incidents"],
  ["neighbors","Neighbors or a group support this"],
  ["report","I filed an official report or request"],
  ["local","I already asked my city or county"]
];
var RISKTXT = [
  "It is not an immediate danger, but it steadily makes daily life harder.",
  "It is a recurring inconvenience with a modest safety side.",
  "It creates a real, ongoing safety concern.",
  "It puts people at meaningful risk of harm.",
  "It puts people at serious risk of harm.",
  "It poses a serious and immediate risk to people’s safety."
];
var $ = function(id){return document.getElementById(id)};
var tab = 1;

// ---------- build form ----------
Object.keys(CATS).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=CATS[k].label;$("cat").appendChild(o)});
EVID.forEach(function(e){var l=document.createElement("label");var c=document.createElement("input");c.type="checkbox";c.id="ev_"+e[0];var s=document.createElement("span");s.textContent=e[1];l.appendChild(c);l.appendChild(s);$("evid").appendChild(l)});

// ---------- read + score ----------
function read(){
  var ev = EVID.filter(function(e){return $("ev_"+e[0]).checked}).map(function(e){return e[0]});
  return {
    problem:$("problem").value.trim(), cat:$("cat").value, place:$("place").value.trim(),
    people:Math.max(1,parseInt($("people").value)||1), months:Math.max(0,parseInt($("months").value)||0),
    risk:parseInt($("risk").value), ev:ev, ask:$("ask").value.trim(),
    name:$("name").value.trim(), rep:$("rep").value.trim()
  };
}
function score(d){
  var c = CATS[d.cat];
  var parts = [
    {k:"Reach", max:25, v:Math.min(Math.log10(d.people+1)/3.5,1)*25},
    {k:"Safety risk", max:30, v:d.risk/5*30},
    {k:"How long it has lasted", max:15, v:Math.min(d.months/12,1)*15},
    {k:"Evidence", max:20, v:d.ev.length/EVID.length*20},
    {k:"Federal fit", max:10, v:c.fit*10}
  ];
  var total = Math.round(parts.reduce(function(a,p){return a+p.v},0));
  return {parts:parts,total:total};
}
function verdict(t){
  if(t<35) return ["Build the case","Gather evidence and talk to neighbors before you send anything."];
  if(t<60) return ["Getting stronger","The issue is real. A few more pieces of proof will make it hard to dismiss."];
  if(t<80) return ["Strong case","This is ready to send. The tips below can still sharpen it."];
  return ["Send it","This is a high-priority, well-documented case. Send it and follow up."];
}
function target(d,s){
  var c = CATS[d.cat], local = d.ev.indexOf("local")>-1;
  if(!local) return "Start local. Ask your city or county first and keep the reply. Representatives take a case more seriously when local channels have already been tried.";
  if(c.fit>=0.7 && s.total>=50) return "Send this to your U.S. Representative. Federal programs can fund this kind of fix" + (c.progs.length?": ask about "+c.progs.join(" and ")+".":".");
  if(c.fit>=0.7) return "Federal money can help here, but strengthen the case first, then send it to your U.S. Representative.";
  return "This is mostly handled locally or by your state. Send it to your city council and state legislator, and copy your U.S. Representative.";
}
function tips(d,s){
  var T = {
    "Reach":"Count who is affected (students, drivers, households) and use a real number. Ask neighbors to add their names.",
    "Safety risk":"Write down specific incidents: near misses, injuries, or complaints. Specifics move the risk rating.",
    "How long it has lasted":"Find the earliest date it was reported and say how long it has gone unresolved.",
    "Evidence":"Take dated photos, keep a simple log, and file an official request so you have a reference number.",
    "Federal fit":"Look up whether a federal grant covers this problem, and mention it by name in your ask."
  };
  return s.parts.map(function(p){return {k:p.k,r:p.v/p.max}}).sort(function(a,b){return a.r-b.r}).slice(0,2).map(function(x){return T[x.k]});
}

// ---------- writing ----------
function dur(m){ if(m<1) return " recently"; if(m<12) return " for about "+m+(m===1?" month":" months"); var y=Math.round(m/12*10)/10; return " for about "+y+(y===1?" year":" years"); }
function evText(d){
  var m = {photos:"photos and video",log:"a dated log of incidents",neighbors:"support from neighbors",report:"an official report on file"};
  var l = d.ev.filter(function(k){return m[k]}).map(function(k){return m[k]});
  if(!l.length) return "";
  if(l.length>1) l[l.length-1]="and "+l[l.length-1];
  return "I have documented this with "+l.join(l.length>2?", ":" ")+". ";
}
function letter(d){
  var c = CATS[d.cat], p = d.problem||"[describe the problem]", rep = d.rep?("Representative "+d.rep):"Representative [last name]";
  var who = d.name||"[your name]", where = d.place?(" near "+d.place):"";
  var s = "Dear "+rep+",\n\nMy name is "+who+", and I am a constituent writing about a "+c.label.toLowerCase()+" concern"+where+": "+p.charAt(0).toLowerCase()+p.slice(1)+".\n\n";
  s += "This problem affects roughly "+d.people.toLocaleString()+" people and has gone unresolved"+dur(d.months)+". "+RISKTXT[d.risk]+" "+evText(d);
  if(d.ev.indexOf("local")>-1) s += "I have already raised it with my local government. ";
  s += "\n\nI respectfully ask that you "+(d.ask?d.ask.charAt(0).toLowerCase()+d.ask.slice(1).replace(/\.$/,""):"[state exactly what you want done]")+".";
  if(c.progs.length) s += " I understand that "+c.progs.join(" and ")+" may be avenues to explore, and I would welcome your office’s guidance.";
  s += "\n\nCould your office tell me who on your staff is following this issue, and what the next step would be? I am glad to share photos, dates, and names of neighbors who support this.\n\nThank you for your time and service.\n\nSincerely,\n"+who;
  return s;
}
function call(d){
  var c = CATS[d.cat], who = d.name||"[your name]", p = d.problem||"[the problem]";
  return "Hello, my name is "+who+" and I’m a constituent"+(d.place?" from "+d.place:"")+".\n\n"+
  "I’m calling about "+p.charAt(0).toLowerCase()+p.slice(1)+". It affects about "+d.people.toLocaleString()+" people and has been going on"+dur(d.months)+". "+RISKTXT[d.risk]+"\n\n"+
  "I’m asking the Representative to "+(d.ask?d.ask.charAt(0).toLowerCase()+d.ask.slice(1).replace(/\.$/,""):"[your ask]")+".\n\n"+
  "Who on your staff handles "+c.label.toLowerCase()+"? Can I send them photos and details by email? May I leave my phone number for a follow-up?\n\nThank you.";
}

// ---------- render ----------
function render(){
  var d = read(), s = score(d), v = verdict(s.total);
  $("riskOut").textContent = d.risk;
  $("score").textContent = s.total;
  $("verdict").textContent = v[0]; $("verdictSub").textContent = v[1];
  var b = $("bars"); b.textContent = "";
  s.parts.forEach(function(p){
    var w = document.createElement("div"); w.className = "bar";
    var h = document.createElement("b"), a = document.createElement("span"), n = document.createElement("span");
    a.textContent = p.k; n.textContent = Math.round(p.v)+" / "+p.max; h.appendChild(a); h.appendChild(n);
    var t = document.createElement("div"); t.className = "track";
    var f = document.createElement("div"); f.className = "fill"; f.style.width = (p.v/p.max*100)+"%";
    t.appendChild(f); w.appendChild(h); w.appendChild(t); b.appendChild(w);
  });
  $("target").textContent = target(d,s);
  var tl = $("tips"); tl.textContent = "";
  tips(d,s).forEach(function(x){var li=document.createElement("li");li.textContent=x;tl.appendChild(li)});
  $("doc").textContent = tab===1 ? letter(d) : call(d);
  $("t1").setAttribute("aria-selected",tab===1); $("t2").setAttribute("aria-selected",tab===2);
}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1800)}

// ---------- events ----------
document.querySelectorAll("input,select,textarea").forEach(function(el){el.addEventListener("input",render)});
$("t1").onclick = function(){tab=1;render()};
$("t2").onclick = function(){tab=2;render()};
$("copy").onclick = function(){
  var txt = $("doc").textContent;
  function fb(){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Select the text and copy it")}document.body.removeChild(a)}
  try{ navigator.clipboard.writeText(txt).then(function(){toast("Copied")},fb) }catch(e){ fb() }
};
$("sample").onclick = function(){
  $("problem").value="No crosswalk at the entrance of our elementary school";
  $("cat").value="roads"; $("place").value="Maple St & 5th Ave, Boise";
  $("people").value=480; $("months").value=14; $("risk").value=4;
  $("ask").value="Fund a marked crosswalk with a flashing beacon and a crossing guard";
  $("name").value="Alex Rivera"; $("rep").value="Smith";
  ["photos","log","neighbors","report","local"].forEach(function(k,i){$("ev_"+k).checked = i<4});
  render();
};

// ---------- saved cases (per-browser convenience; safe if storage is blocked) ----------
function load(){try{return JSON.parse(localStorage.getItem("louder.cases")||"[]")}catch(e){return []}}
function store(a){try{localStorage.setItem("louder.cases",JSON.stringify(a))}catch(e){toast("Saving is blocked in this browser")}}
function setForm(d){
  $("problem").value=d.problem;$("cat").value=d.cat;$("place").value=d.place;$("people").value=d.people;$("months").value=d.months;
  $("risk").value=d.risk;$("ask").value=d.ask;$("name").value=d.name;$("rep").value=d.rep;
  EVID.forEach(function(e){$("ev_"+e[0]).checked = d.ev.indexOf(e[0])>-1});
  render();
}
function renderSaved(){
  var a = load(), ul = $("savedList"); ul.textContent = ""; $("savedBox").hidden = !a.length;
  a.forEach(function(d,i){
    var li=document.createElement("li"), n=document.createElement("span"); n.textContent=(d.problem||"Untitled case")+" ("+score(d).total+")";
    var bx=document.createElement("span");
    var o=document.createElement("button");o.className="ghost";o.type="button";o.textContent="Open";o.onclick=function(){setForm(d)};
    var x=document.createElement("button");x.className="ghost";x.type="button";x.textContent="Delete";x.style.marginLeft="6px";
    x.onclick=function(){var b=load();b.splice(i,1);store(b);renderSaved()};
    bx.appendChild(o);bx.appendChild(x);li.appendChild(n);li.appendChild(bx);ul.appendChild(li);
  });
}
$("save").onclick = function(){var d=read(); if(!d.problem){toast("Describe the problem first");return} var a=load();a.unshift(d);store(a.slice(0,10));renderSaved();toast("Saved")};

render(); renderSaved();
</script>
</body>
</html>
